<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy"
        content="default-src 'self'; img-src 'self' https: data:; style-src 'self'; script-src 'self'">
  <title>Subscroll</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <aside class="sidebar">
    <div class="brand"><img src="logo.svg" alt=""><div><div class="brand-name">Subscroll</div><div class="brand-tagline" data-i18n>Every game you already pay for, in one place.</div></div></div>
    <nav id="nav">
      <div class="nav-head" data-i18n>Discover</div>
      <button data-view="foryou" data-i18n>For you</button>
      <button data-view="browse" class="active" data-i18n>Browse</button>
      <div class="nav-head" data-i18n>What's changing</div>
      <button data-view="coming"><span data-i18n>Coming soon</span> <span class="count" id="coming-count"></span></button>
      <button data-view="leaving"><span data-i18n>Leaving soon</span> <span class="count" id="leaving-count"></span></button>
      <button data-view="changes" data-i18n>New &amp; departed</button>
      <button data-view="calendar" data-i18n>Calendar</button>
      <button data-view="free"><span data-i18n>Free to keep</span> <span class="count" id="free-count"></span></button>
      <div class="nav-head" data-i18n>Your games</div>
      <button data-view="toplay"><span data-i18n>To play</span> <span class="count" id="toplay-count"></span></button>
      <button data-view="mine" data-i18n>My games</button>
      <button data-view="stats" data-i18n>Statistics</button>
      <button data-view="value" data-i18n>Value</button>
      <div class="nav-sep"></div>
      <button data-view="subs" data-i18n>Settings</button>
    </nav>
    <div class="update-banner" id="update-banner"></div>
    <button class="roll" id="roll-btn" title="Pick a random game from your subscriptions" data-i18n-title data-i18n>🎲 Roll a game</button>
    <details class="sync" id="sync"><summary id="sync-summary"></summary><div class="sync-list" id="sync-list"></div></details>
    <div class="sync muted" id="ratings-status"></div>
    <div class="refresh-split" id="refresh-split">
      <button class="refresh" id="refresh-btn">Refresh your subscriptions</button>
      <button class="refresh refresh-more" id="refresh-more" aria-haspopup="menu" aria-expanded="false" title="More refresh options" data-i18n-title>▾</button>
      <div class="refresh-menu" id="refresh-menu" role="menu" hidden>
        <button role="menuitem" id="refresh-all" data-i18n>Refresh all catalogues</button>
      </div>
    </div>
  </aside>

  <main>
    <header class="toolbar" id="toolbar">
      <input id="search" type="search" placeholder="Search games…" data-i18n-placeholder title="Search (Ctrl+F)" data-i18n-title autocomplete="off">
      <div class="chips" id="service-chips"></div>
      <select id="status-filter" title="Played status" data-i18n-title>
        <option value="all" data-i18n>Any status</option>
        <option value="none" data-i18n>Not played</option>
        <option value="wishlist" data-i18n>To play</option>
        <option value="playing" data-i18n>Now playing</option>
        <option value="played" data-i18n>Played</option>
        <option value="completed" data-i18n>Completed</option>
        <option value="dropped" data-i18n>Dropped</option>
        <option value="ignored" data-i18n>Ignored</option>
        <option value="steam" data-i18n>On Steam</option>
      </select>
      <select id="platform-filter" title="Platform" data-i18n-title></select>
      <select id="genre-filter" title="Genre" data-i18n-title></select>
      <select id="length-filter" title="How long to beat (main story)" data-i18n-title></select>
      <select id="sort" title="Sort" data-i18n-title>
        <option value="title" data-i18n>A–Z</option>
        <option value="release" data-i18n>Newest release</option>
        <option value="added" data-i18n>Recently added</option>
        <option value="score" data-i18n>Metacritic score</option>
        <option value="short" data-i18n>Shortest to beat</option>
        <option value="long" data-i18n>Longest to beat</option>
        <option value="stars" data-i18n>Your rating</option>
      </select>
      <div class="layout-seg" id="layout-seg" role="group">
        <button data-layout="grid" title="Covers" data-i18n-title>▦</button>
        <button data-layout="list" title="List" data-i18n-title>☰</button>
      </div>
      <div class="hide-wrap" id="hide-wrap">
        <button class="hide-btn" id="hide-btn" aria-haspopup="true" aria-expanded="false"><span data-i18n>Hide…</span><span class="hide-count" id="hide-count"></span><span class="hide-arrow">▾</span></button>
        <div class="hide-menu" id="hide-menu" hidden>
          <label class="toggle"><input type="checkbox" id="mine-only"> <span data-i18n>Games outside my subscriptions</span></label>
          <label class="toggle"><input type="checkbox" id="hide-completed"> <span data-i18n>Completed games</span></label>
          <label class="toggle"><input type="checkbox" id="hide-dropped"> <span data-i18n>Dropped games</span></label>
          <label class="toggle"><input type="checkbox" id="hide-ignored"> <span data-i18n>Ignored games</span></label>
          <label class="toggle"><input type="checkbox" id="hide-departed"> <span data-i18n>Games that left their service</span></label>
        </div>
      </div>
    </header>
    <div class="summary" id="summary"></div>
    <section id="content"></section>
  </main>

  <div class="drawer hidden" id="drawer"></div>
  <script src="i18n.js"></script>
  <script src="locales/fr.js"></script>
  <script src="locales/de.js"></script>
  <script src="locales/it.js"></script>
  <script src="locales/pt-BR.js"></script>
  <script src="locales/ja.js"></script>
  <script src="locales/ko.js"></script>
  <script src="unify.js"></script>
  <script src="genres.js"></script>
  <script src="stats.js"></script>
  <script src="value.js"></script>
  <script src="planprices.js"></script>
  <script src="regions.js"></script>
  <script src="cheapest.js"></script>
  <script src="goals.js"></script>
  <script src="deadline.js"></script>
  <script src="recommend.js"></script>
  <script src="advisor.js"></script>
  <script src="calendar.js"></script>
  <script src="play.js"></script>
  <script src="app.js"></script>
</body>
</html>
