<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy"
        content="default-src 'self'; img-src 'self' https: data:; style-src 'self'; script-src 'self'">
  <title>Subscroll</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <aside class="sidebar">
    <div class="brand"><img src="logo.svg" alt=""><div><div class="brand-name">Subscroll</div><div class="brand-tagline">Every game you already pay for, in one place.</div></div></div>
    <nav id="nav">
      <button data-view="browse" class="active">Browse</button>
      <button data-view="coming">Coming soon <span class="count" id="coming-count"></span></button>
      <button data-view="leaving">Leaving soon <span class="count" id="leaving-count"></span></button>
      <button data-view="changes">New &amp; departed</button>
      <button data-view="mine">My games</button>
      <button data-view="stats">Statistics</button>
      <button data-view="subs">Settings</button>
    </nav>
    <button class="roll" id="roll-btn" title="Pick a random game from your subscriptions">🎲 Roll a game</button>
    <div class="sync" id="sync"></div>
    <div class="sync muted" id="ratings-status"></div>
    <button class="refresh" id="refresh-btn">Refresh catalogues</button>
  </aside>

  <main>
    <header class="toolbar" id="toolbar">
      <input id="search" type="search" placeholder="Search games…" autocomplete="off">
      <div class="chips" id="service-chips"></div>
      <select id="status-filter" title="Played status">
        <option value="all">Any status</option>
        <option value="none">Not played</option>
        <option value="played">Played</option>
        <option value="completed">Completed</option>
        <option value="ignored">Ignored</option>
        <option value="steam">On Steam</option>
      </select>
      <select id="platform-filter" title="Platform"></select>
      <select id="genre-filter" title="Genre"></select>
      <select id="length-filter" title="How long to beat (main story)"></select>
      <select id="sort" title="Sort">
        <option value="title">A–Z</option>
        <option value="release">Newest release</option>
        <option value="added">Recently added</option>
        <option value="score">Metacritic score</option>
        <option value="short">Shortest to beat</option>
        <option value="long">Longest to beat</option>
      </select>
      <div class="toggles">
        <label class="toggle"><input type="checkbox" id="mine-only"> Only my subscriptions</label>
        <label class="toggle"><input type="checkbox" id="hide-completed"> Hide completed</label>
        <label class="toggle"><input type="checkbox" id="hide-ignored"> Hide ignored</label>
        <label class="toggle"><input type="checkbox" id="hide-departed"> Hide departed</label>
      </div>
    </header>
    <div class="summary" id="summary"></div>
    <section id="content"></section>
  </main>

  <div class="drawer hidden" id="drawer"></div>
  <script src="unify.js"></script>
  <script src="genres.js"></script>
  <script src="stats.js"></script>
  <script src="app.js"></script>
</body>
</html>
